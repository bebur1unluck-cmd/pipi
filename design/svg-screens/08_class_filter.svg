  </defs>
  <title>08 Фильтр по классу</title>
  <rect width="390" height="844" rx="28" fill="#F8F1EC"/>
  <text x="24" y="16" fill="#2F2824" font-size="13" font-weight="700" text-anchor="start" class="body">
