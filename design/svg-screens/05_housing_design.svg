      .small { font-size: 11px; }
      .body { font-size: 13px; }
      .label { font-size: 12px; font-weight: 600; }
      .h1 { font-size: 24px; font-weight: 800; }
      .h2 { font-size: 18px; font-weight: 700; }
      .btn { font-size: 14px; font-weight: 700; }
