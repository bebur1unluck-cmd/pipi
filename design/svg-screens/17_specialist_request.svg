<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2F2824" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, sans-serif; dominant-baseline: hanging; }
      .small { font-size: 11px; }
      .body { font-size: 13px; }
      .label { font-size: 12px; font-weight: 600; }
      .h1 { font-size: 24px; font-weight: 800; }
      .h2 { font-size: 18px; font-weight: 700; }
      .btn { font-size: 14px; font-weight: 700; }
    </style>
  </defs>
  <title>17 Заявка специалисту</title>
  <rect width="390" height="844" rx="28" fill="#F8F1EC"/>
  <text x="24" y="16" fill="#2F2824" font-size="13" font-weight="700" text-anchor="start" class="body">
    <tspan x="24" dy="0">9:41</tspan>
  </text>
  <rect x="300" y="18" width="42" height="12" rx="6" fill="#2F2824" opacity="0.18"/>
  <rect x="346" y="18" width="20" height="12" rx="6" fill="#2F2824" opacity="0.18"/>
  <rect x="20" y="48" width="40" height="40" rx="14" fill="#FFFDFC" filter="url(#cardShadow)"/>
  <text x="40" y="55" fill="#744637" font-size="24" font-weight="800" text-anchor="middle" class="h1">
    <tspan x="40" dy="0">‹</tspan>
  </text>
  <text x="72" y="46" fill="#2F2824" font-size="22" font-weight="800" text-anchor="start" class="">
    <tspan x="72" dy="0">Заявка</tspan>
  </text>
  <text x="72" y="76" fill="#806B62" font-size="12" font-weight="400" text-anchor="start" class="">
    <tspan x="72" dy="0">Короткое ТЗ для специалиста</tspan>
  </text>
  <rect x="330" y="50" width="40" height="40" rx="14" fill="#FFFDFC" filter="url(#cardShadow)"/>
  <text x="350" y="57" fill="#A96F58" font-size="18" font-weight="700" text-anchor="middle" class="h2">
    <tspan x="350" dy="0">♡</tspan>
  </text>
  <rect x="20" y="112" width="350" height="72" rx="20" fill="#FFFDFC" filter="url(#cardShadow)"/>
  <text x="38" y="124" fill="#806B62" font-size="11" font-weight="700" text-anchor="start" class="small">
    <tspan x="38" dy="0">Объект</tspan>
  </text>
  <text x="38" y="146" fill="#2F2824" font-size="14" font-weight="400" text-anchor="start" class="">
    <tspan x="38" dy="0">Студия 29 м², вторичное жилье</tspan>
  </text>
  <rect x="20" y="204" width="350" height="72" rx="20" fill="#FFFDFC" filter="url(#cardShadow)"/>
  <text x="38" y="216" fill="#806B62" font-size="11" font-weight="700" text-anchor="start" class="small">
    <tspan x="38" dy="0">Проблема</tspan>
  </text>
  <text x="38" y="238" fill="#2F2824" font-size="14" font-weight="400" text-anchor="start" class="">
    <tspan x="38" dy="0">Нужно зонирование и хранение</tspan>
  </text>
  <rect x="20" y="296" width="350" height="72" rx="20" fill="#FFFDFC" filter="url(#cardShadow)"/>
  <text x="38" y="308" fill="#806B62" font-size="11" font-weight="700" text-anchor="start" class="small">
    <tspan x="38" dy="0">Бюджет</tspan>
  </text>
  <text x="38" y="330" fill="#2F2824" font-size="14" font-weight="400" text-anchor="start" class="">
    <tspan x="38" dy="0">Комфорт, до 120 тыс. ₽ на реализацию</tspan>
  </text>
  <rect x="20" y="388" width="350" height="72" rx="20" fill="#FFFDFC" filter="url(#cardShadow)"/>
  <text x="38" y="400" fill="#806B62" font-size="11" font-weight="700" text-anchor="start" class="small">
    <tspan x="38" dy="0">Комментарий</tspan>
  </text>
  <text x="38" y="422" fill="#2F2824" font-size="14" font-weight="400" text-anchor="start" class="">
    <tspan x="38" dy="0">Старые коммуникации на кухне, мало</tspan>
    <tspan x="38" dy="19">естественного света</tspan>
  </text>
  <rect x="20" y="530" width="350" height="96" rx="24" fill="#DCEBE7"/>
  <text x="40" y="558" fill="#2F2824" font-size="14" font-weight="400" text-anchor="start" class="">
    <tspan x="40" dy="0">После отправки специалист получит</tspan>
    <tspan x="40" dy="19">сохраненные проекты и критерии</tspan>
    <tspan x="40" dy="19">подбора.</tspan>
  </text>
  <rect x="20" y="724" width="350" height="52" rx="18" fill="#A96F58" filter="url(#cardShadow)"/>
  <text x="195.0" y="741" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle" class="">
    <tspan x="195.0" dy="0">Отправить заявку</tspan>
  </text>
  <a href="16_master_profile.svg" aria-label="Назад: profile">
    <title>Назад: profile</title>
    <rect x="20" y="48" width="40" height="40" rx="14" fill="#FFFFFF" opacity="0.001" style="cursor:pointer;"/>
  </a>
  <a href="11_favorites.svg" aria-label="Перейти в избранное">
    <title>Перейти в избранное</title>
    <rect x="330" y="50" width="40" height="40" rx="14" fill="#FFFFFF" opacity="0.001" style="cursor:pointer;"/>
  </a>
  <a href="11_favorites.svg" aria-label="Отправить заявку">
    <title>Отправить заявку</title>
    <rect x="20" y="724" width="350" height="52" rx="18" fill="#FFFFFF" opacity="0.001" style="cursor:pointer;"/>
  </a>
</svg>
